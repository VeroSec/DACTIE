# The Rust version for local builds, CI and the Docker images (FROM rust:1.100 in crates/*/Dockerfile).
# Pinned so that a new Rust release cannot break the build unnoticed: move the toolchain here and
# FROM rust:<version> in crates/*/Dockerfile together, in a pull request of its own.
[toolchain]
channel = "1.100"
components = ["clippy", "rustfmt"]
