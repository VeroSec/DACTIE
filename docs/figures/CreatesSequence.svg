<?xml version="1.0" encoding="UTF-8"?>
<!-- A member creates an additional sharing peer (docs/PROTOCOL.md, section 3). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="585" viewBox="0 0 1000 585"
     font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>text{paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round} .n, .n text{stroke:none}</style>
  <rect width="1000" height="585" fill="#fff"/>

  <!-- participants present from the start -->
  <g stroke="#222" stroke-width="1.5">
    <rect x="15" y="15" width="150" height="54" rx="4" fill="#dae8fc"/>
    <rect x="530" y="15" width="140" height="54" rx="4" fill="#ffe6cc"/>
    <rect x="810" y="15" width="140" height="54" rx="4" fill="#d5e8d4"/>
  </g>
  <g text-anchor="middle" class="n">
    <text x="90" y="38" font-weight="bold">Member</text>
    <text x="90" y="58">(holds member key)</text>
    <text x="600" y="38" font-weight="bold">AA</text>
    <text x="600" y="58">(issuer)</text>
    <text x="880" y="38" font-weight="bold">ARC i</text>
    <text x="880" y="58">(i = 1..n)</text>
  </g>

  <!-- 0 member creates the new sharing peer -->
  <line x1="90" y1="110" x2="205" y2="110" stroke="#222" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#arro)"/>
  <text x="147" y="102" text-anchor="middle" font-size="13">«create»</text>
  <g stroke="#222" stroke-width="1.5"><rect x="205" y="83" width="170" height="54" rx="4" fill="#dae8fc"/></g>
  <g text-anchor="middle" class="n">
    <text x="290" y="106" font-weight="bold">New sharing peer</text>
    <text x="290" y="126">(own PeerID)</text>
  </g>

  <!-- lifelines -->
  <g stroke="#555" stroke-width="1.2" stroke-dasharray="6,5">
    <line x1="90" y1="69" x2="90" y2="550"/>
    <line x1="290" y1="137" x2="290" y2="550"/>
    <line x1="600" y1="69" x2="600" y2="550"/>
    <line x1="880" y1="69" x2="880" y2="550"/>
  </g>

  <!-- key material the member hands to the new peer (PROTOCOL.md: Identifiers and keys, section 3) -->
  <rect x="15" y="147" width="262" height="62" fill="#fff8e1" stroke="#999"/>
  <text x="25" y="165" font-size="13" class="n">needs the <tspan font-weight="bold">member key</tspan>: secret sk,</text>
  <text x="25" y="183" font-size="13" class="n">credential (σ<tspan baseline-shift="sub" font-size="10">1</tspan>, σ<tspan baseline-shift="sub" font-size="10">2</tspan>, e<tspan baseline-shift="sub" font-size="10">1</tspan>) (key_material.json),</text>
  <text x="25" y="201" font-size="13" class="n">used slots (slots.json)</text>

  <!-- 1 RequestOpenerKeys -->
  <line x1="290" y1="180" x2="600" y2="180" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="445" y="172" text-anchor="middle"><tspan font-weight="bold">RequestOpenerKeys</tspan></text>
  <!-- 2 OpenerKeys -->
  <line x1="600" y1="220" x2="290" y2="220" stroke="#222" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#arro)"/>
  <text x="445" y="212" text-anchor="middle"><tspan font-weight="bold">OpenerKeys</tspan> {ARC keys, t, epoch, k} (gs)</text>

  <!-- new peer: slot and re-sharing with the member key -->
  <rect x="175" y="235" width="230" height="44" fill="#fff8e1" stroke="#999"/>
  <text x="290" y="253" text-anchor="middle" font-size="13" class="n">claim a free slot of the epoch,</text>
  <text x="290" y="271" text-anchor="middle" font-size="13" class="n">re-share sk with fresh randomness</text>

  <!-- 3 AddPeerToSig -->
  <line x1="290" y1="335" x2="600" y2="335" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="445" y="310" text-anchor="middle"><tspan font-weight="bold">AddPeerToSig</tspan> {KeyPackage, enc. shares,</text>
  <text x="445" y="327" text-anchor="middle">commitments, slot tag, proof} (gs)</text>
  <!-- AA verifies -->
  <rect x="610" y="345" width="210" height="44" fill="#fff8e1" stroke="#999"/>
  <text x="715" y="363" text-anchor="middle" font-size="13" class="n">verify proof and shares,</text>
  <text x="715" y="381" text-anchor="middle" font-size="13" class="n">accept each slot tag once</text>

  <!-- 4 AddPeerShare -->
  <line x1="600" y1="430" x2="880" y2="430" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="740" y="405" text-anchor="middle"><tspan font-weight="bold">AddPeerShare</tspan> {PeerID,</text>
  <text x="740" y="422" text-anchor="middle">enc. share i, commitments} (gs)</text>
  <!-- ARC verifies and stores -->
  <rect x="805" y="440" width="150" height="26" fill="#fff8e1" stroke="#999"/>
  <text x="880" y="458" text-anchor="middle" font-size="13" class="n">verify share, store</text>

  <!-- AA adds the peer to the common group -->
  <rect x="480" y="474" width="240" height="26" fill="#fff8e1" stroke="#999"/>
  <text x="600" y="492" text-anchor="middle" font-size="13" class="n">add PeerID to common MLS group</text>

  <!-- 5 PeerAdded -->
  <line x1="600" y1="535" x2="290" y2="535" stroke="#222" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#arro)"/>
  <text x="445" y="527" text-anchor="middle"><tspan font-weight="bold">PeerAdded</tspan> (else PeerRefused)</text>

  <!-- legend -->
  <text x="15" y="575" font-size="12" fill="#444">solid: request · dashed: response · (gs): group-signed, so the AA does not learn which member asks · k: slots per epoch</text>
</svg>
