<?xml version="1.0" encoding="UTF-8"?>
<!-- Archives store CTI and serve returning peers (docs/PROTOCOL.md, section 6). -->
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"
     font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>text{paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round} .n, .n text{stroke:none}</style>
  <rect width="920" height="520" fill="#fff"/>

  <!-- participants -->
  <g stroke="#222" stroke-width="1.5">
    <rect x="20" y="15" width="180" height="54" rx="4" fill="#dae8fc"/>
    <rect x="245" y="15" width="170" height="54" rx="4" fill="#dae8fc"/>
    <rect x="490" y="15" width="140" height="54" rx="4" fill="#d5e8d4"/>
    <rect x="700" y="15" width="190" height="54" rx="4" fill="#d5e8d4"/>
  </g>
  <g text-anchor="middle" class="n">
    <text x="110" y="38" font-weight="bold">Sharing peer</text>
    <text x="110" y="58">(publisher)</text>
    <text x="330" y="38" font-weight="bold">Returning peer</text>
    <text x="330" y="58">(was offline)</text>
    <text x="560" y="38" font-weight="bold">ARC</text>
    <text x="560" y="58">(all channels)</text>
    <text x="795" y="38" font-weight="bold">ARC database</text>
    <text x="795" y="58">(PostgreSQL)</text>
  </g>

  <!-- lifelines -->
  <g stroke="#555" stroke-width="1.2" stroke-dasharray="6,5">
    <line x1="110" y1="69" x2="110" y2="490"/>
    <line x1="330" y1="69" x2="330" y2="490"/>
    <line x1="560" y1="69" x2="560" y2="490"/>
    <line x1="795" y1="69" x2="795" y2="490"/>
  </g>

  <!-- 1 message arrives over GossipSub -->
  <line x1="110" y1="125" x2="560" y2="125" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="335" y="100" text-anchor="middle"><tspan font-weight="bold">BroadcastEnc / GroupEnc</tspan></text>
  <text x="335" y="117" text-anchor="middle">via GossipSub</text>
  <rect x="470" y="137" width="180" height="26" fill="#fff8e1" stroke="#999"/>
  <text x="560" y="155" text-anchor="middle" font-size="13" class="n">verify group signature</text>

  <!-- 2 store common-group message -->
  <line x1="560" y1="225" x2="795" y2="225" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="677" y="200" text-anchor="middle">common group:</text>
  <text x="677" y="217" text-anchor="middle"><tspan font-weight="bold">decrypted</tspan>, searchable</text>
  <!-- 3 store private-group message -->
  <line x1="560" y1="290" x2="795" y2="290" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="677" y="265" text-anchor="middle">private group:</text>
  <text x="677" y="282" text-anchor="middle"><tspan font-weight="bold">ciphertext</tspan></text>
  <text x="677" y="310" text-anchor="middle" font-size="13" font-style="italic" fill="#444">attributed: stored without MemberID</text>

  <!-- opt frame: catching up -->
  <rect x="230" y="335" width="670" height="140" fill="none" stroke="#777" stroke-width="1.2"/>
  <path d="M230,335 h52 v16 l-8,8 h-44 z" fill="#eee" stroke="#777" stroke-width="1.2"/>
  <text x="238" y="352" font-size="13" font-weight="bold" class="n">opt</text>
  <text x="292" y="352" font-size="13" font-style="italic">[peer was offline]</text>

  <!-- 4 Update -->
  <line x1="330" y1="390" x2="560" y2="390" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="445" y="382" text-anchor="middle"><tspan font-weight="bold">Update</tspan> {group_id, epoch} (gs)</text>
  <!-- 5 commits and proposals -->
  <line x1="560" y1="435" x2="330" y2="435" stroke="#222" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#arro)"/>
  <text x="445" y="427" text-anchor="middle">MLS commits, proposals since epoch</text>
  <rect x="250" y="445" width="160" height="26" fill="#fff8e1" stroke="#999"/>
  <text x="330" y="463" text-anchor="middle" font-size="13" class="n">apply in order</text>

  <!-- legend -->
  <text x="20" y="510" font-size="12" fill="#444">solid: message · dashed: response · (gs): group-signed, ARCs ignore unsigned requests · no consensus needed: CTI messages are independent records</text>
</svg>
