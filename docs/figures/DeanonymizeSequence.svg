<?xml version="1.0" encoding="UTF-8"?>
<!-- Archives de-anonymize a sharing peer by opening its signature (docs/PROTOCOL.md, section 7). -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530"
     font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>text{paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round} .n, .n text{stroke:none}</style>
  <rect width="900" height="530" fill="#fff"/>

  <!-- participants -->
  <g stroke="#222" stroke-width="1.5">
    <rect x="30" y="15" width="200" height="54" rx="4" fill="#dae8fc"/>
    <rect x="360" y="15" width="140" height="54" rx="4" fill="#ffe6cc"/>
    <rect x="680" y="15" width="170" height="54" rx="4" fill="#d5e8d4"/>
  </g>
  <g text-anchor="middle" class="n">
    <text x="130" y="38" font-weight="bold">Reporting member</text>
    <text x="130" y="58">(sharing peer)</text>
    <text x="430" y="38" font-weight="bold">AA</text>
    <text x="430" y="58">(combiner)</text>
    <text x="765" y="38" font-weight="bold">ARC i</text>
    <text x="765" y="58">(operator decides)</text>
  </g>

  <!-- lifelines -->
  <g stroke="#555" stroke-width="1.2" stroke-dasharray="6,5">
    <line x1="130" y1="69" x2="130" y2="500"/>
    <line x1="430" y1="69" x2="430" y2="500"/>
    <line x1="765" y1="69" x2="765" y2="500"/>
  </g>

  <!-- 1 report, out of band -->
  <line x1="130" y1="110" x2="430" y2="110" stroke="#222" stroke-width="1.5" stroke-dasharray="2,4" marker-end="url(#arr)"/>
  <text x="280" y="102" text-anchor="middle"><tspan font-weight="bold">report</tspan> {signature, evidence}</text>
  <text x="280" y="128" text-anchor="middle" font-size="13" font-style="italic" fill="#444">out of band</text>

  <!-- 2 RequestOpen -->
  <line x1="430" y1="170" x2="765" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="597" y="162" text-anchor="middle"><tspan font-weight="bold">RequestOpen</tspan> {signature} (gs)</text>
  <!-- 3 OpenPending -->
  <line x1="765" y1="210" x2="430" y2="210" stroke="#222" stroke-width="1.5" stroke-dasharray="7,4" marker-end="url(#arro)"/>
  <text x="597" y="202" text-anchor="middle"><tspan font-weight="bold">OpenPending</tspan></text>

  <!-- ARC operator decides -->
  <rect x="670" y="225" width="190" height="44" fill="#fff8e1" stroke="#999"/>
  <text x="765" y="243" text-anchor="middle" font-size="13" class="n">operator reviews evidence:</text>
  <text x="765" y="261" text-anchor="middle" font-size="13" class="n">approve or deny</text>
  <rect x="670" y="279" width="190" height="44" fill="#fff8e1" stroke="#999"/>
  <text x="765" y="297" text-anchor="middle" font-size="13" class="n">partial opening for</text>
  <text x="765" y="315" text-anchor="middle" font-size="13" class="n">every stored share</text>

  <!-- 4 SubmitOpenPairings -->
  <line x1="765" y1="365" x2="430" y2="365" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="597" y="357" text-anchor="middle"><tspan font-weight="bold">SubmitOpenPairings</tspan></text>

  <!-- AA combines -->
  <rect x="270" y="380" width="320" height="44" fill="#fff8e1" stroke="#999"/>
  <text x="430" y="398" text-anchor="middle" font-size="13" class="n">once ≥ t ARCs contributed: combine (Lagrange),</text>
  <text x="430" y="416" text-anchor="middle" font-size="13" class="n">test against every MemberID and PeerID</text>
  <rect x="290" y="440" width="280" height="30" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="430" y="460" text-anchor="middle" font-size="14" font-weight="bold" class="n">MemberID, name, all its PeerIDs</text>

  <!-- legend -->
  <text x="30" y="520" font-size="12" fill="#444">solid: request · dashed: response · dotted: out of band · (gs): group-signed · fewer than t ARCs approve: nothing is revealed</text>
</svg>
