services:
  # Postgres for archive_node1 on 10.244.192.117
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archivepw
      POSTGRES_DB: archivedb
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    profiles: ["node117"]

  # Postgres for archive_node2 on 10.244.192.118
  db2:
    image: postgres:16
    container_name: postgres_db2
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archivepw
      POSTGRES_DB: archivedb
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db2_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    profiles: ["node118"]

  adminer:
    image: adminer:4
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    profiles: ["node117"]

  # Authority lives on host .116 and listens on 10001
  authority_node:
    image: dactie-authority
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_0:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-authority
      -K /usr/src/dactie/key_material/
      -p 10001'
    environment:
      - RUST_LOG=info
    ports:
      - "10001:10001"
    profiles: ["node116"]

  # Archive on 10.244.192.117 with DSN to local db
  archive_node1:
    image: dactie-archive
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_1:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-archive
      -K /usr/src/dactie/key_material/
      -u "postgres://archive:archivepw@db:5432/archivedb"
      -i archive1
      -a "$${BOOT_PEER_ID}"
      -B /ip4/10.244.192.116/tcp/10001
      -p 20011'
    env_file:
      - key_material/boot_id.env
    environment:
      - RUST_LOG=debug
    depends_on:
      - db
    ports:
      - "20011:20011"
    profiles: ["node117"]

  # Archive on 10.244.192.118 with DSN to its local db2
  archive_node2:
    image: dactie-archive
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_2:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-archive
      -K /usr/src/dactie/key_material/
      -u "postgres://archive:archivepw@db2:5432/archivedb"
      -i archive2
      -a "$${BOOT_PEER_ID}"
      -B /ip4/10.244.192.116/tcp/10001
      -p 20012'
    env_file:
      - key_material/boot_id.env
    environment:
      - RUST_LOG=debug
    depends_on:
      - db2
    ports:
      - "20012:20012"
    profiles: ["node118"]

  # Peer on 10.244.192.117
  peer_1:
    image: dactie-peer
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_3:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-peer
      -K /usr/src/dactie/key_material/
      -b "$${BOOT_PEER_ID}"
      -B "/ip4/10.244.192.116/tcp/10001"
      -p 21011'
    environment:
      - RUST_LOG=info
    env_file:
      - key_material/boot_id.env
    ports:
      - "21011:21011"
    profiles: ["node117"]

  # Peer on 10.244.192.118
  peer_2:
    image: dactie-peer
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_4:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-peer
      -K /usr/src/dactie/key_material/
      -b "$${BOOT_PEER_ID}"
      -B "/ip4/10.244.192.116/tcp/10001"
      -p 21012'
    environment:
      - RUST_LOG=info
    env_file:
      - key_material/boot_id.env
    ports:
      - "21012:21012"
    profiles: ["node118"]

  # Peers on 10.244.192.119
  peer_3:
    image: dactie-peer
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_5:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-peer
      -K /usr/src/dactie/key_material/
      -b "$${BOOT_PEER_ID}"
      -B "/ip4/10.244.192.116/tcp/10001"
      -p 21013'
    environment:
      - RUST_LOG=info
    env_file:
      - key_material/boot_id.env
    ports:
      - "21013:21013"
    profiles: ["node119"]

  peer_4:
    image: dactie-peer
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_6:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-peer
      -K /usr/src/dactie/key_material/
      -b "$${BOOT_PEER_ID}"
      -B "/ip4/10.244.192.116/tcp/10001"
      -p 21014'
    environment:
      - RUST_LOG=info
    env_file:
      - key_material/boot_id.env
    ports:
      - "21014:21014"
    profiles: ["node119"]

volumes:
  db_data:
  db2_data:
