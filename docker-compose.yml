services:
  # Postgres for archive_node1 on 10.244.192.117
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archivepw
      POSTGRES_DB: archivedb
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    profiles: ["node117"]

  # Postgres for archive_node2 on 10.244.192.118
  db2:
    image: postgres:16
    container_name: postgres_db2
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archivepw
      POSTGRES_DB: archivedb
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db2_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    profiles: ["node118"]

  adminer:
    image: adminer:4
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    profiles: ["node117"]

  # Authority lives on host .116 and listens on 10001
  authority_node:
    image: dactie-authority
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./dactie-authority/Dockerfile
    network_mode: "host"
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_0:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-authority
      -K /usr/src/dactie/key_material/
      -p 10001
      --advertise-addr /ip4/10.244.192.116/tcp/10001'
    environment:
      - RUST_LOG=info
    profiles: ["node116"]

  # Archive on 10.244.192.117 with DSN to local db
  archive_node1:
    image: dactie-archive
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./dactie-archive/Dockerfile
    network_mode: "host"
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_1:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-archive
      -K /usr/src/dactie/key_material/
      -u "postgres://archive:archivepw@127.0.0.1:5432/archivedb"
      -i archive1
      -a "$${BOOT_PEER_ID}"
      -B /ip4/10.244.192.116/tcp/10001
      -p 20011
      --advertise-addr /ip4/10.244.192.117/tcp/20011'
    env_file:
      - key_material/boot_id.env
    environment:
      - RUST_LOG=debug
    depends_on:
      - db
    profiles: ["node117"]

  # Archive on 10.244.192.118 with DSN to its local db2
  archive_node2:
    image: dactie-archive
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./dactie-archive/Dockerfile
    network_mode: "host"
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_2:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-archive
      -K /usr/src/dactie/key_material/
      -u "postgres://archive:archivepw@127.0.0.1:5433/archivedb"
      -i archive2
      -a "$${BOOT_PEER_ID}"
      -B /ip4/10.244.192.116/tcp/10001
      -p 20012
      --advertise-addr /ip4/10.244.192.118/tcp/20012'
    env_file:
      - key_material/boot_id.env
    environment:
      - RUST_LOG=debug
    depends_on:
      - db2
    profiles: ["node118"]

  # Peer on 10.244.192.117
  peer_1:
    image: dactie-peer
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./dactie-peer/Dockerfile
      args:
        FEATURES: bench
    network_mode: "host"
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_3:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-peer
      -K /usr/src/dactie/key_material/
      -b "$${BOOT_PEER_ID}"
      -B "/ip4/10.244.192.116/tcp/10001"
      -p 21011
      --metrics-addr 0.0.0.0:9898
      --advertise-addr /ip4/10.244.192.117/tcp/21011'
    environment:
      - RUST_LOG=info
    env_file:
      - key_material/boot_id.env
    profiles: ["node117"]

  # Peer on 10.244.192.118
  peer_2:
    image: dactie-peer
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./dactie-peer/Dockerfile
      args:
        FEATURES: bench
    network_mode: "host"
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_4:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-peer
      -K /usr/src/dactie/key_material/
      -b "$${BOOT_PEER_ID}"
      -B "/ip4/10.244.192.116/tcp/10001"
      -p 21012
      --metrics-addr 0.0.0.0:9898
      --advertise-addr /ip4/10.244.192.118/tcp/21012'
    environment:
      - RUST_LOG=info
    env_file:
      - key_material/boot_id.env
    profiles: ["node118"]

  # Peers on 10.244.192.119
  peer_3:
    image: dactie-peer
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./dactie-peer/Dockerfile
      args:
        FEATURES: bench
    network_mode: "host"
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_5:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-peer
      -K /usr/src/dactie/key_material/
      -b "$${BOOT_PEER_ID}"
      -B "/ip4/10.244.192.116/tcp/10001"
      -p 21013
      --metrics-addr 0.0.0.0:9898
      --advertise-addr /ip4/10.244.192.119/tcp/21013'
    environment:
      - RUST_LOG=info
    env_file:
      - key_material/boot_id.env
    profiles: ["node119"]

  peer_4:
    image: dactie-peer
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: ./dactie-peer/Dockerfile
      args:
        FEATURES: bench
    network_mode: "host"
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - ./key_material/key_material_6:/usr/src/dactie/key_material:rw
    command: >-
      sh -c '/usr/src/dactie/target/release/dactie-peer
      -K /usr/src/dactie/key_material/
      -b "$${BOOT_PEER_ID}"
      -B "/ip4/10.244.192.116/tcp/10001"
      -p 21014
      --metrics-addr 0.0.0.0:9899
      --advertise-addr /ip4/10.244.192.119/tcp/21014
      --stem-fluff-probability $${STEM_Q}'
    environment:
      - RUST_LOG=info
      - BENCH_PUBLISH=${BENCH_PUBLISH:-true}
      # Stem phase of the benchmark publisher; STEM_Q=0 measures latency without it.
      - STEM_Q=${STEM_Q:-0.2}
      # Left unset by default so the sweep can override them per run without
      # editing this file: `BENCH_RATE=5 BENCH_PAYLOAD_FILE=... docker compose up`.
      - BENCH_RATE=${BENCH_RATE:-40}
      - BENCH_TOPIC=Test
      - BENCH_PAYLOAD_FILE=${BENCH_PAYLOAD_FILE:-}
      # Archive-query latency driver; off unless BENCH_ARCHIVE_PEER is supplied.
      - BENCH_ARCHIVE_QUERY=${BENCH_ARCHIVE_QUERY:-false}
      - BENCH_ARCHIVE_PEER=${BENCH_ARCHIVE_PEER:-}
      - BENCH_ARCHIVE_RATE=${BENCH_ARCHIVE_RATE:-1}
    env_file:
      - key_material/boot_id.env
    profiles: ["node119"]

volumes:
  db_data:
  db2_data:

networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.244.192.0/24
