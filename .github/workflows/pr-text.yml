# Rule 1 for the title and description of a pull request. A separate workflow, so that
# editing the description reruns only this check and not the Docker builds.
name: pr-text

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  public:
    name: "Rule 1: pull request title and description"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Title and body go through the environment, never into the script itself, so that
      # text in them cannot run as shell code.
      - env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | python3 scripts/check_public.py text "pull request"
