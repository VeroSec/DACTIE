# The three rules in CONTRIBUTING.md, checked on every pull request and every push to main.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: "Rule 1: nothing that points at our infrastructure"
    runs-on: ubuntu-24.04
    env:
      # User names and internal domains that the check must also refuse. A secret, because
      # listing them in the repository would publish them.
      PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Files
        run: python3 scripts/check_public.py tree
      - name: Commits of the pull request (messages and every added line)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_public.py commits "$HEAD" --not "$BASE"
      - name: Pushed commits (messages and every added line)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: python3 scripts/check_public.py commits "$AFTER" --not "$BEFORE"

  ruff:
    name: "Rule 2: ruff"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint.sh python

  rust:
    name: "Rule 2: rustfmt and clippy"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the version and components that rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/lint.sh rust

  # The other linters of rule 2, each in its own check (versions pinned in scripts/lint.sh).
  shellcheck:
    name: "Rule 2: shellcheck"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint.sh shell

  hadolint:
    name: "Rule 2: hadolint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint.sh docker

  actionlint:
    name: "Rule 2: actionlint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint.sh actions

  go:
    name: "Rule 2: gofmt and go vet"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint.sh go

  compose:
    name: "Rule 3: docker-compose.yml is valid"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The env file that the bring-up writes (docs/RUNBOOK.md, Phase 4), with a placeholder.
      - run: mkdir -p key_material && echo 'BOOT_PEER_ID=placeholder' > key_material/boot_id.env
      - run: >-
          docker compose --profile node116 --profile node117 --profile node118
          --profile node119 config --quiet

  docker:
    name: "Rule 3: docker build ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dactie-authority
            dockerfile: crates/dactie-authority/Dockerfile
            context: .
          - name: dactie-archive
            dockerfile: crates/dactie-archive/Dockerfile
            context: .
          - name: dactie-peer
            dockerfile: crates/dactie-peer/Dockerfile
            context: .
          # The compose file and the benchmarks build the peer with the load generator.
          - name: dactie-peer (bench)
            dockerfile: crates/dactie-peer/Dockerfile
            context: .
            build_arg: FEATURES=bench
          - name: fabric loadgen
            dockerfile: experiments/fabric/loadgen/Dockerfile
            context: experiments/fabric/loadgen
          - name: fabric chaincode
            dockerfile: experiments/fabric/chaincode/Dockerfile
            context: experiments/fabric/chaincode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          BUILD_ARG: ${{ matrix.build_arg }}
        run: docker build --progress=plain -f "$DOCKERFILE" ${BUILD_ARG:+--build-arg "$BUILD_ARG"} "$CONTEXT"
